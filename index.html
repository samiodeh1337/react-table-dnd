            "name": "How do I install react-table-dnd?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Run npm install react-table-dnd and import \"react-table-dnd/styles\" once. It needs React 18 or newer."
            }
          },
          {
            "@type": "Question",
            "name": "Can I drag several rows at once?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Turn on selectable, select rows with click, Ctrl/Cmd+click, Shift+click or checkboxes, and drag any selected row to move them all. Apply the drop with moveRowsById."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work on phones and tablets?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. A long-press starts a drag and ordinary swipes scroll the table."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work with large tables?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. It works with @tanstack/react-virtual for 100,000+ rows. React renders only when a drag starts and when it ends."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work with TanStack Table?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. TanStack Table keeps the rows and the column order, and these components render and drag them."
            }

      <div
        style="

        <h1>react-table-dnd: drag-and-drop rows and columns for React tables</h1>
        <p>
          Reorder rows and columns by dragging, drag a multi-row selection as one group, and
          virtualize 100,000+ rows. Works on touch screens. No dependencies besides React.
        </p>

        <h2>Install</h2>
        <p>
          <code>npm install react-table-dnd</code>, then
          <code>import "react-table-dnd/styles"</code> once.
        </p>

        <h2>Features</h2>
        <ul>
          <li>Row and column reordering</li>
          <li>Multi-select with click, Ctrl/Cmd, Shift, checkboxes or tap, dragged as one group</li>
          <li>Virtual tables with @tanstack/react-virtual</li>
          <li>Long-press to drag on touch screens</li>
          <li>Drag handles, locked rows and columns</li>
          <li>Drag events: onDragStart, onDragOver, onDragEnd, onDragCancel</li>
          <li>Works with TanStack Table</li>
          <li>TypeScript types, ESM and CommonJS, server rendering</li>
        </ul>

        <h2>Components</h2>
        <ul>
          <li>TableContainer: the root, with the drag events and selection props</li>
          <li>TableHeader and ColumnCell: the header row and its draggable cells</li>
          <li>TableBody, BodyRow and RowCell: the body, its draggable rows and their cells</li>
          <li>DragHandle and SelectHandle: limit dragging or selecting to one element</li>
        </ul>

        <p>
          <a href="https://github.com/samiodeh1337/react-table-dnd">GitHub</a> |
          <a href="https://www.npmjs.com/package/react-table-dnd">npm</a>
        </p>
